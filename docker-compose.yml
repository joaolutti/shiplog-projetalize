# Local development database only. Production uses Render managed Postgres.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: shiplog
      POSTGRES_PASSWORD: shiplog
      POSTGRES_DB: shiplog
    ports:
      - "5432:5432"
    volumes:
      - shiplog-db:/var/lib/postgresql/data
volumes:
  shiplog-db:
