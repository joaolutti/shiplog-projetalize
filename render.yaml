# Render Blueprint for the free plan (D56): one web service runs the migrations, the worker and the
# web app (scripts/start.sh). The database is an external Postgres (Supabase), set as DATABASE_URL.
# Step by step: docs/DEPLOY.md.
services:
  - type: web
    name: shiplog
    runtime: docker
    plan: free
    region: virginia
    dockerCommand: bash scripts/start.sh
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: APP_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: BETTER_AUTH_SECRET
        generateValue: true

      - key: SLACK_CLIENT_ID
        sync: false
      - key: SLACK_CLIENT_SECRET
        sync: false
      - key: SLACK_TEAM_ID
        sync: false
      - key: SLACK_BOT_TOKEN
        sync: false
      - key: SLACK_SIGNING_SECRET
        sync: false
      - key: SLACK_FEED_CHANNEL_ID
        sync: false

      - key: GITLAB_GROUP_PATH
        sync: false
      - key: GITLAB_MEMBERSHIP_PROJECT
        sync: false
      - key: GITLAB_WEBHOOK_SECRET
        generateValue: true
      - key: GITLAB_API_TOKEN
        sync: false
      - key: GITLAB_OAUTH_CLIENT_ID
        sync: false
      - key: GITLAB_OAUTH_CLIENT_SECRET
        sync: false

      - key: LLM_ENABLED
        value: "true"
      - key: LLM_PROVIDER_NAME
        value: openrouter
      - key: LLM_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: LLM_MODEL
        value: nvidia/nemotron-3.5-super-vl:free
      - key: LLM_API_KEY
        sync: false
