name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The database tests run against a real Postgres, as they do locally (TEST_DATABASE_URL).
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: shiplog
          POSTGRES_PASSWORD: shiplog
          POSTGRES_DB: shiplog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shiplog"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://shiplog:shiplog@localhost:5432/shiplog_test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4

      # Next.js runs on Node.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test
      - run: bun run build
